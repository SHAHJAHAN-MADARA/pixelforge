<body>
<header class="site-header"><div class="container nav"><a class="logo" href="../"><span class="logo-mark">PF</span><span>PixelForge</span></a><nav class="nav-links"><a href="compress.html">Compress</a><a href="resize.html">Resize</a><a href="png-to-jpg.html">Convert</a><a href="crop.html">Crop</a></nav><button class="nav-toggle" aria-label="Menu">☰</button></div></header>

<main class="tool-page"><div class="container">
  <div class="tool-head"><h1>Image Resizer</h1><p>Change image dimensions by pixels or percentage. Lock aspect ratio to prevent distortion.</p></div>

  <div class="workspace">
    <div class="drop-zone" id="dz">
      <div class="dz-icon">📐</div>
      <div class="dz-text">Drop an image here or click to browse</div>
      <div class="dz-hint">JPEG, PNG, WebP — up to 50 MB</div>
      <input type="file" accept="image/*">
    </div>

    <div id="editor" class="hide">
      <div class="opts-row" style="margin-top:20px">
        <label class="field" style="margin:0"><span class="lbl">Width (px)</span><input class="input" type="number" id="w" min="1" style="width:120px"></label>
        <label class="field" style="margin:0"><span class="lbl">Height (px)</span><input class="input" type="number" id="h" min="1" style="width:120px"></label>
        <label style="display:flex;align-items:center;gap:6px;margin-top:18px"><input type="checkbox" id="lock" checked> Lock ratio</label>
        <label class="field" style="margin:0"><span class="lbl">Scale %</span><input class="input" type="number" id="pct" value="100" min="1" max="500" style="width:100px"></label>
      </div>

      <div class="preview-area"><canvas id="cvs"></canvas></div>
      <div class="img-info"><span>Original: <b id="origDim">—</b></span><span>New: <b id="newDim">—</b></span></div>
      <div class="actions">
        <button class="btn btn-primary" id="dlBtn">⬇ Download resized</button>
        <button class="btn btn-outline" id="resetBtn">🔄 New image</button>
      </div>
    </div>
  </div>
</div></main>

<footer class="site-footer"><div class="container"><div class="footer-bottom"><div>&copy; <span data-year></span> PixelForge</div><div><a href="../">Home</a></div></div></div></footer>

<script src="../assets/common.js"></script>
<script>
var cvs = document.getElementById('cvs'), ctx = cvs.getContext('2d');
var curImg, origW, origH, ratio;

PF.setupDrop(document.getElementById('dz'), function(f) {
  PF.readImage(f, function(img) {
    curImg = img; origW = img.naturalWidth; origH = img.naturalHeight; ratio = origW / origH;
    document.getElementById('w').value = origW;
    document.getElementById('h').value = origH;
    document.getElementById('origDim').textContent = origW + ' x ' + origH;
    document.getElementById('dz').classList.add('hide');
    document.getElementById('editor').classList.remove('hide');
    render();
  });
});

function render() {
  var w = +document.getElementById('w').value || origW;
  var h = +document.getElementById('h').value || origH;
  cvs.width = w; cvs.height = h;
  ctx.drawImage(curImg, 0, 0, w, h);
  document.getElementById('newDim').textContent = w + ' x ' + h;
}

document.getElementById('w').addEventListener('input', function() {
  if (document.getElementById('lock').checked) document.getElementById('h').value = Math.round(+this.value / ratio);
  document.getElementById('pct').value = Math.round(+this.value / origW * 100);
  render();
});
document.getElementById('h').addEventListener('input', function() {
  if (document.getElementById('lock').checked) document.getElementById('w').value = Math.round(+this.value * ratio);
  document.getElementById('pct').value = Math.round(+document.getElementById('h').value / origH * 100);
  render();
});
document.getElementById('pct').addEventListener('input', function() {
  var p = +this.value / 100;
  document.getElementById('w').value = Math.round(origW * p);
  document.getElementById('h').value = Math.round(origH * p);
  render();
});

document.getElementById('dlBtn').addEventListener('click', function() {
  cvs.toBlob(function(b) { PF.download(b, 'resized.png'); }, 'image/png');
});
document.getElementById('resetBtn').addEventListener('click', function() {
  document.getElementById('dz').classList.remove('hide');
  document.getElementById('editor').classList.add('hide');
});
</script>
</body>
</html>
