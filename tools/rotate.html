<meta name="description" content="Rotate images 90°, 180°, 270° or flip horizontal and vertical online for free. No upload — instant rotation in your browser. Supports JPEG, PNG, WebP.">

<link rel="canonical" href="https://SHAHJAHAN-MADARA.github.io/pixelforge/tools/rotate.html">

<script type="application/ld+json">{"@context":"https://schema.org","@type":"WebApplication","name":"Rotate & Flip Image","url":"https://SHAHJAHAN-MADARA.github.io/pixelforge/tools/rotate.html","applicationCategory":"MultimediaApplication","offers":{"@type":"Offer","price":"0"}}</script>
</head>
<body>
<header class="site-header"><div class="container nav"><a class="logo" href="../"><span class="logo-mark">PF</span><span>PixelForge</span></a><nav class="nav-links"><a href="compress.html">Compress</a><a href="resize.html">Resize</a><a href="png-to-jpg.html">Convert</a><a href="crop.html">Crop</a></nav><button class="nav-toggle" aria-label="Menu">☰</button></div></header>

<main class="tool-page"><div class="container">
  <div class="tool-head"><h1>Rotate &amp; Flip</h1><p>Rotate by 90°, 180°, 270° or flip your image horizontally and vertically.</p></div>

  <div class="workspace">
    <div class="drop-zone" id="dz">
      <div class="dz-icon">🔄</div>
      <div class="dz-text">Drop an image here or click to browse</div>
      <div class="dz-hint">JPEG, PNG, WebP — up to 50 MB</div>
      <input type="file" accept="image/*">
    </div>

    <div id="editor" class="hide">
      <div class="opts-row" style="margin-top:20px">
        <button class="btn btn-outline" data-rot="90">↻ 90°</button>
        <button class="btn btn-outline" data-rot="180">↻ 180°</button>
        <button class="btn btn-outline" data-rot="270">↻ 270°</button>
        <button class="btn btn-outline" data-flip="h">↔ Flip H</button>
        <button class="btn btn-outline" data-flip="v">↕ Flip V</button>
        <button class="btn btn-sm" id="resetRot">Reset</button>
      </div>

      <div class="preview-area"><canvas id="cvs"></canvas></div>
      <div class="img-info"><span id="dims"></span></div>
      <div class="actions">
        <button class="btn btn-primary" id="dlBtn">⬇ Download</button>
        <button class="btn btn-outline" id="resetBtn">🔄 New image</button>
      </div>
    </div>
  </div>
</div></main>

<footer class="site-footer"><div class="container"><div class="footer-bottom"><div>&copy; <span data-year></span> PixelForge</div><div><a href="../">Home</a></div></div></div></footer>

<script src="../assets/common.js"></script>
<script>
var cvs = document.getElementById('cvs'), ctx = cvs.getContext('2d');
var curImg, angle = 0, flipH = false, flipV = false;

PF.setupDrop(document.getElementById('dz'), function(f) {
  PF.readImage(f, function(img) {
    curImg = img; angle = 0; flipH = false; flipV = false;
    document.getElementById('dz').classList.add('hide');
    document.getElementById('editor').classList.remove('hide');
    render();
  });
});

function render() {
  var w = curImg.naturalWidth, h = curImg.naturalHeight;
  var swap = angle === 90 || angle === 270;
  cvs.width = swap ? h : w; cvs.height = swap ? w : h;
  ctx.save();
  ctx.translate(cvs.width / 2, cvs.height / 2);
  ctx.rotate(angle * Math.PI / 180);
  ctx.scale(flipH ? -1 : 1, flipV ? -1 : 1);
  ctx.drawImage(curImg, -w / 2, -h / 2);
  ctx.restore();
  document.getElementById('dims').textContent = cvs.width + ' x ' + cvs.height;
}

document.querySelectorAll('[data-rot]').forEach(function(btn) {
  btn.addEventListener('click', function() { angle = (angle + +this.dataset.rot) % 360; render(); });
});
document.querySelectorAll('[data-flip]').forEach(function(btn) {
  btn.addEventListener('click', function() {
    if (this.dataset.flip === 'h') flipH = !flipH; else flipV = !flipV; render();
  });
});
document.getElementById('resetRot').addEventListener('click', function() { angle = 0; flipH = false; flipV = false; render(); });

document.getElementById('dlBtn').addEventListener('click', function() {
  cvs.toBlob(function(b) { PF.download(b, 'rotated.png'); }, 'image/png');
});
document.getElementById('resetBtn').addEventListener('click', function() {
  document.getElementById('dz').classList.remove('hide'); document.getElementById('editor').classList.add('hide');
});
</script>
</body>
</html>
